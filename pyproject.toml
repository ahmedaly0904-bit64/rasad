[project]
name = "rasad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "plotly>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
