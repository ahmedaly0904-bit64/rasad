[project]
name = "rasad"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "plotly>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
examples = ["mesa>=3.5", "networkx>=3.0", "pandas>=2.0", "simpy>=4.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# S, I, R is the standard notation of compartmental epidemic models.
# Renaming them to satisfy a linter would make the code harder to read,
# not easier — the whole point of the notation is that readers know it.
"examples/*" = ["E741"]
